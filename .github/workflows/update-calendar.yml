name: Update calendar feed

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        env:
          # Optional — set these under Settings → Secrets and variables → Actions → Variables
          LEAGUES: ${{ vars.LEAGUES }}
          TEAMS: ${{ vars.TEAMS }}
          ALARM_MINUTES: ${{ vars.ALARM_MINUTES }}
          SHOW_RESULTS: ${{ vars.SHOW_RESULTS }}
          CAL_NAME: ${{ vars.CAL_NAME }}
        run: |
          mkdir -p public
          cp index.html public/
          python worlds_calendar.py --out public/worlds.ics

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
